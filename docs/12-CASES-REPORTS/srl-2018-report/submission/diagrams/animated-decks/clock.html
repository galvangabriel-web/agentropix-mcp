<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@keyframes animotion-fadeIn { from { opacity: 0; } to { opacity: 1; } }

.animotion-fade-in { animation: animotion-fadeIn 0.6s ease-out both; }

@keyframes animotion-fadeInLeft { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); } }

.animotion-fade-in-left { animation: animotion-fadeInLeft 0.6s ease-out both; }

@keyframes animotion-fadeInLeftBig { from { opacity: 0; transform: translateX(-200px); } to { opacity: 1; transform: translateX(0); } }

.animotion-fade-in-left-big { animation: animotion-fadeInLeftBig 0.8s ease-out both; }

@keyframes animotion-zoomIn { from { opacity: 0; transform: scale(0.3); } to { opacity: 1; transform: scale(1); } }

.animotion-zoom-in { animation: animotion-zoomIn 0.5s ease-out both; }

@keyframes animotion-zoomInLeft { from { opacity: 0; transform: scale(0.1) translateX(-1000px); } 60% { opacity: 1; transform: scale(0.475) translateX(10px); } to { transform: scale(1) translateX(0); } }

.animotion-zoom-in-left { animation: animotion-zoomInLeft 0.6s cubic-bezier(0.55, 0.055, 0.675, 0.19) both; }

@keyframes animotion-bounceIn { 0% { opacity: 0; transform: scale(0.3); } 20% { transform: scale(1.1); } 40% { transform: scale(0.9); } 60% { opacity: 1; transform: scale(1.03); } 80% { transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }

.animotion-bounce-in { animation: animotion-bounceIn 0.75s cubic-bezier(0.215, 0.61, 0.355, 1) both; }

@keyframes animotion-jackInTheBox { 0% { opacity: 0; transform: scale(0.1) rotate(30deg); transform-origin: center bottom; } 50% { transform: rotate(-10deg); } 70% { transform: rotate(3deg); } to { opacity: 1; transform: scale(1) rotate(0); } }

.animotion-jack-in-the-box { animation: animotion-jackInTheBox 0.8s ease both; }

@keyframes animotion-pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } to { transform: scale(1); } }

.animotion-pulse { animation: animotion-pulse 1s ease-in-out infinite; }

@keyframes animotion-shakeX { 0%, to { transform: translateX(0); } 10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); } 20%, 40%, 60%, 80% { transform: translateX(10px); } }

.animotion-shake-x { animation: animotion-shakeX 0.8s ease-in-out both; }

@keyframes animotion-typewriter { from { width: 0; } to { width: 100%; } }

.animotion-typewriter { animation: animotion-typewriter 2s steps(30, end) both; overflow: hidden; white-space: nowrap; border-right: 2px solid; }
@keyframes vt-tick { from { opacity:0.01 } to { opacity:0.02 } }
.vt-ticker { position:fixed; bottom:0; right:0; width:2px; height:2px; background:#0d1117; animation:vt-tick 0.12s infinite alternate }
* { box-sizing:border-box; margin:0; padding:0 }
html,body { width:1400px; height:460px; overflow:hidden; background:#0d1117; color:#e6edf3; font-family:'DejaVu Sans',system-ui,sans-serif }
.wrap { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:30px 60px; text-align:center }
h1 { font-size:40px } .sub { font-size:22px; color:#8b949e }
.blue{color:#58a6ff}.green{color:#3fb950}.red{color:#f85149}.amber{color:#d29922}.purple{color:#bc8cff}
.chips { display:flex; flex-wrap:wrap; gap:12px; justify-content:center }
.chip { background:#161b22; border:2px solid #58a6ff; border-radius:22px; padding:8px 20px; font-size:20px }
.chip.tok { border-color:#d29922; background:#2a2008; font-family:monospace }
.chip.gap { border-color:#f85149; background:#2d1214 }
.counter { font-size:72px; font-weight:bold; font-family:monospace }
.bar { height:30px; border-radius:8px; transition:width 1.4s ease-out; width:0 }
.row { display:flex; align-items:center; gap:14px; width:1000px }
.lbl { width:160px; text-align:right; font-size:20px }
.funny { font-size:19px; color:#d29922; font-style:italic }
.waitbar { height:24px; background:linear-gradient(90deg,#f85149,#da3633); border-radius:12px; width:0; transition:width 5s linear }
.fill-back { animation-fill-mode:backwards }
.d1{animation-delay:.3s}.d2{animation-delay:.9s}.d3{animation-delay:1.5s}.d4{animation-delay:2.1s}.d5{animation-delay:2.7s}
</style></head><body><div class="vt-ticker"></div><div class="wrap">
<h1 class="animotion-fade-in fill-back" style="font-size:34px"><!-- @license lucide-static v1.17.0 - ISC -->
<svg style="width:34px;height:34px;color:#d29922" 
  class="lucide lucide-clock"
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="2"
  stroke-linecap="round"
  stroke-linejoin="round"
>
  <circle cx="12" cy="12" r="10" />
  <path d="M12 6v6l4 2" />
</svg> One run, two speeds <span class="funny">(geology vs. lightning)</span></h1>
<div class="row animotion-fade-in fill-back d1" style="width:1100px"><span class="lbl red">log2timeline</span><div class="waitbar" id="w"></div><span class="red" style="font-size:20px;white-space:nowrap">⏳ 91 min — 96.8% of the run</span></div>
<div class="sub animotion-fade-in fill-back" style="animation-delay:6s">…then the hunt agent woke up:</div>
<div class="chips" id="burst"></div>
<div class="funny" id="punch" style="opacity:0">8 correlations in 217 microseconds. blink and you missed it. ~100,000 times.</div></div>
<script>function start(){
setTimeout(()=>{document.getElementById('w').style.width='760px';},800);
const D=[["case","+0µs"],["evidence","+55µs"],["across","+89µs"],["complete","+118µs"],["coverage","+142µs"],["scan","+167µs"],["yara","+195µs"],["host","+217µs"]];
const b=document.getElementById('burst');
setTimeout(()=>{D.forEach((x,i)=>{setTimeout(()=>{const c=document.createElement('div');c.className='chip tok animotion-jack-in-the-box';c.innerHTML='<b>'+x[0]+'</b> <span style="color:#8b949e;font-size:15px">'+x[1]+'</span>';b.appendChild(c);},i*420);});},7000);
setTimeout(()=>{const p=document.getElementById('punch');p.style.opacity=1;p.classList.add('animotion-fade-in');},11000);
setTimeout(()=>{document.title='DONE';},15000);}
window.__start=start;</script></body></html>
