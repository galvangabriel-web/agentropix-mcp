# Ground Truth - base-mail-memory.img (SANS SRL-2018 Compromised Enterprise Network)
#
# Mail server memory snapshot in the SRL-2018 case. The 2026-05-03 FULL-CASE
# memory pass surfaced 504 findings on this host:
#   - 500 memory.service (all tagged T1543.003 - Windows Service inventory)
#   - 2   hunt.correlate (cross-source agreement: 'error' flagged by
#                         injection_detector + memory)
#   - 1   memory.injection.error
#   - 1   yara_hunt.empty
#
# Authored 2026-05-06. Mail-memory-specific signal: paused-VM snapshot
# (no socket/pslist data), service-only profile. The 2026-05-05 mail
# deep-dive (Reports_results/MAIL-DEEP-DIVE-20260505T224352Z) found T1566
# typosquat (stark-research-labs.co) on this image via direct CC-BASH
# bulk_extractor work, but those IOCs aren't in this FULL-CASE report -
# T1566 will surface here only after issue #23 (memory->EML carve sidecar)
# lands. This GT scores what the FULL-CASE memory pass actually surfaces.

case_id: "SANS-APT-MAIL-MEM-2018"
image: "base-mail-memory.img"
filesystem: "memory"
description: >
  SANS SRL-2018 Compromised Enterprise Network - mail server memory
  snapshot (paused-VM, no socket/pslist data; service-only profile).
  500 services inventoried; cross-source correlation between injection
  and memory agents on 'error' token (real signal of injection-attempt
  artefacts). T1566 typosquat IOCs from the 2026-05-05 mail deep-dive
  are out-of-scope here pending issue #23 mem->EML carve sidecar.

expected_tactics:
  - "T1543.003"   # Windows Service (500 services inventoried)
  - "T1055"       # Process Injection (injection.error - injection scan attempted)
  - "T1140"       # Deobfuscate/Decode Files or Information (cross-source 'error' correlation)
  - "T1497"       # Virtualization/Sandbox Evasion (paused-VM snapshot detection)

expected_findings:
  - artifact_path: "memory.service"
    description: "Windows Service inventory - 500 services discovered (T1543.003 surface scan)"
    mitre_technique_id: "T1543.003"
    expected_agent: "MemoryAgent"
    difficulty: "trivial"
    evidence_keywords:
      - "T1543.003"
      - "SERVICE"
      - "binary"

  - artifact_path: "memory.service"
    description: "svchost.exe-hosted services via -k netsvcs grouping (mail server hosts many svchost services)"
    mitre_technique_id: "T1543.003"
    expected_agent: "MemoryAgent"
    difficulty: "correlation"
    evidence_keywords:
      - "svchost.exe"
      - "netsvcs"
      - "binary"

  - artifact_path: "memory.injection"
    description: "Process injection scan attempted (memory.injection.error indicates scan ran but couldn't complete)"
    mitre_technique_id: "T1055"
    expected_agent: "MemoryAgent"
    difficulty: "trivial"
    evidence_keywords:
      - "injection"
      - "error"
      - "image"

  - artifact_path: "hunt.correlate"
    description: "Cross-source 'error' agreement between injection_detector + memory agents - real injection-attempt artefact signal"
    mitre_technique_id: "T1140"
    expected_agent: "HuntAgent"
    difficulty: "correlation"
    evidence_keywords:
      - "Cross-source"
      - "agents"
      - "error"

scoring:
  true_positives: 4
  false_positive_penalty: -0.5
  hallucination_is_fp: true
  recall_threshold: 0.50
  notes: >
    base-mail-memory expects ONLY 4 distinct techniques (not 7) because
    the paused-VM snapshot mode unlocked only service-side data on this
    image. This is an HONEST GT for the data the agent currently sees;
    when issue #23 mem->EML carve sidecar lands, this GT should expand
    to include T1566.* findings from the typosquat (stark-research-labs.co)
    case the 2026-05-05 deep-dive surfaced.
