    description: "Credential triage attempt (T1003.002)"
    mitre_technique_id: "T1003.002"
    expected_agent: "MemoryAgent"
    difficulty: "correlation"
    evidence_keywords:
      - "Credential"
      - "triage"
      - "impacket"

  - artifact_path: "memory.injection"
    description: "Process injection scan baseline (wkstn-06 clean)"
    mitre_technique_id: "T1055"
    expected_agent: "MemoryAgent"
    difficulty: "trivial"
    evidence_keywords:
