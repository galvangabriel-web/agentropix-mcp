scoring:
  true_positives: 7
  false_positive_penalty: -0.5
  hallucination_is_fp: true
  recall_threshold: 0.57
  notes: >
    base-wkstn-06-memory expects 7 distinct techniques. Wkstn-06 is the
    only host with public-IP outbound (248.86.12.27) - distinctive
