      - "indicators"
      - "malfind"

  - artifact_path: "memory.netscan"
    description: "Network endpoint inventory (108 sockets, 6 to 172.16.4.6 DC)"
    mitre_technique_id: "T1071"
    expected_agent: "MemoryAgent"
    difficulty: "trivial"
    evidence_keywords:
      - "TCPv4"
      - "172.16"
      - "proto"

  - artifact_path: "memory.netscan"
    description: "PUBLIC IP outbound 248.86.12.27 - external C2 candidate (T1071.001 Web Protocols, ONLY host with public outbound)"
    mitre_technique_id: "T1071.001"
    expected_agent: "MemoryAgent"
