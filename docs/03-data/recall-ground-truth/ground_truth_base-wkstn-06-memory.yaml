# Ground Truth - base-wkstn-06-memory.img (SANS SRL-2018 Compromised Enterprise Network)
#
# Workstation #6 memory snapshot. The 2026-05-03 FULL-CASE memory pass
# surfaced 120 findings on this host:
#   - 108 memory.socket (TCPv4/UDP, 6 sockets to 172.16.4.6 (DC),
#                        2 sockets to 248.86.12.27 (PUBLIC IP - external C2),
#                        listeners on 3389/445/5985/8081/47001)
#   - 8   memory.pslist (csrss x2, choco.exe (Chocolatey package manager),
#                        certutil.exe, plus standard winlogon/explorer)
#   - 4   informational
#
# Authored 2026-05-06. Wkstn-06-specific signal: 248.86.12.27 PUBLIC IP
# outbound (T1071.001 web protocols / external C2 candidate - ONLY host
# in the case with public-IP outbound), choco.exe orphan (T1072 Software
# Deployment Tools - distinctive package-manager evidence), certutil.exe
# (T1140 LOLBin), plus port 8081 listener (HTTP alt) and 47001 (WinRM HTTPS).

case_id: "SANS-APT-WKSTN06-MEM-2018"
image: "base-wkstn-06-memory.img"
filesystem: "memory"
description: >
  SANS SRL-2018 Compromised Enterprise Network - user workstation #6
  memory snapshot. The ONLY host with public-IP outbound traffic
  (248.86.12.27, 2 sockets) - external C2 candidate. choco.exe orphan
  (Chocolatey package manager) is distinctive evidence of T1072 Software
  Deployment Tools usage. certutil.exe LOLBin (T1140) + port 8081 listener
  (HTTP alt) round out the externally-leaning attacker profile.

expected_tactics:
  - "T1003.002"   # OS Credential Dumping
  - "T1055"       # Process Injection (clean baseline)
  - "T1071"       # Application Layer Protocol (108 sockets)
  - "T1071.001"   # Web Protocols (248.86.12.27 public IP - C2 candidate)
  - "T1140"       # Deobfuscate/Decode Files (certutil LOLBin)
  - "T1072"       # Software Deployment Tools (choco.exe Chocolatey)
  - "T1547.001"   # Boot/Logon Autostart (csrss x2 + winlogon orphans)

expected_findings:
